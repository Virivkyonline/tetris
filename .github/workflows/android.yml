name: Android APK

on:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Inštalácia závislostí
        run: npm ci

      - name: Skopírovanie hier do Android projektu
        run: npx cap sync android

      - name: Zostavenie APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Premenovanie
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RetroHry.apk

      - name: Uloženie APK k behu
        uses: actions/upload-artifact@v4
        with:
          name: RetroHry-apk
          path: RetroHry.apk
          if-no-files-found: error

      - name: Vydanie na stiahnutie (len hlavná vetva)
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Retro Hry – Android (zostava ${{ github.run_number }})
          files: RetroHry.apk
          make_latest: true
          body: |
            Android apka s hrami Kocky, Formulky a Líška a vajíčka.

            **Inštalácia:** stiahni `RetroHry.apk` v telefóne, otvor ho a povoľ inštaláciu z tohto zdroja.
            Novšia verzia sa nainštaluje cez staršiu a rekordy ostanú.
